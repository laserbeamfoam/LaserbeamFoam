[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "AutoCalibrateParameter"
version = "1.0.0"
description = "Melt pool simulation parameter calibration framework for laserbeamFoam"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "pyyaml",
    "joblib",
]

[project.optional-dependencies]
bayes = ["scikit-optimize"]

[tool.setuptools.packages.find]
where = ["."]
include = ["AutoCalibrateParameter*"]
